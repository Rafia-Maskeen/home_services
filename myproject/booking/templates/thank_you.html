{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gradient-to-br from-white to-[#fff3ea] px-4">
  <div class="bg-white shadow-xl rounded-2xl p-10 max-w-md text-center animate-fade-in-up transition-all duration-700">
    <!-- ✅ Success Icon -->
    <div class="bg-green-100 text-green-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-lg">
      ✓
    </div>

    <!-- ✅ Thank You Message -->
    <h2 class="text-3xl font-bold text-[#FF6B00] mb-4">Thank You!</h2>
    <p class="text-gray-700 text-lg mb-6">Your service has been successfully booked. We appreciate your trust in us.</p>

    <!-- ✅ Add Review or Show Submitted -->

      <a href="/"
         class="inline-block bg-[#FF6B00] text-white px-6 py-3 rounded-lg hover:bg-[#e55a00] transition-all duration-300 shadow-md animate-pulse">
        OK
      </a>
   
  </div>
</section>

<!-- ✅ Simple Animation -->
<style>
@keyframes fade-in-up {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.animate-fade-in-up {
  animation: fade-in-up 0.6s ease-out both;
}
</style>
{% endblock %}
