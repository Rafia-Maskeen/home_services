{% extends 'base.html' %}
{% load static %}

{% block content %}

<!-- Hero Section -->
<section class="bg-gradient-to-br from-[#FFF1E6] to-[#FFEBD1] py-20 px-6 md:px-24 text-center">
  <h1 class="text-4xl md:text-5xl font-extrabold text-[#FF6B00] mb-4">Get in Touch</h1>
  <p class="text-lg text-[#333] max-w-xl mx-auto">Have a question, feedback, or service request? We'd love to hear from you.</p>
</section>

<!-- Contact Form & Info -->
<section class="bg-white py-20 px-6 md:px-24">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-start">
    
    <!-- Contact Form -->
    <div class="bg-[#FFF9F0] p-8 rounded-2xl shadow-md" data-aos="fade-right">
      <form action="{% url 'contact' %}" method="POST" class="space-y-6">
        {% csrf_token %}
        <div>
          <label class="block mb-1 text-sm font-medium text-[#333]">Your Name</label>
          <input type="text" name="name" required class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#FF6B00]">
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-[#333]">Email Address</label>
          <input type="email" name="email" required class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#FF6B00]">
        </div>
        <div>
          <label class="block mb-1 text-sm font-medium text-[#333]">Message</label>
          <textarea name="message" rows="5" required class="w-full p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#FF6B00]"></textarea>
        </div>
        <button type="submit" class="bg-[#FF6B00] hover:bg-[#e85d00] text-white px-6 py-3 rounded-xl shadow-md transition">
          Send Message
        </button>
      </form>
    </div>

    <!-- Contact Info -->
    <div class="space-y-8 text-[#333]" data-aos="fade-left">
      <div class="flex items-start gap-4">
        <img src="https://cdn-icons-png.flaticon.com/512/7269/7269760.png" class="w-8 h-8" alt="">
        <div>
          <h4 class="font-bold text-[#FF6B00]">Phone</h4>
          <p>+92 123 456 7890</p>
        </div>
      </div>
      <div class="flex items-start gap-4">
        <img src="https://cdn-icons-png.flaticon.com/512/542/542638.png" class="w-8 h-8" alt="">
        <div>
          <h4 class="font-bold text-[#FF6B00]">Email</h4>
          <p>support@homeservice.com</p>
        </div>
      </div>
      <div class="flex items-start gap-4">
        <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" class="w-8 h-8" alt="">
        <div>
          <h4 class="font-bold text-[#FF6B00]">Address</h4>
          <p>123 Main Street, Lahore, Pakistan</p>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- Optional Map -->
<section class="px-6 md:px-24 pb-20" data-aos="zoom-in">
  <iframe 
    src="https://maps.google.com/maps?q=kotli+azad+kashmir&t=&z=13&ie=UTF8&iwloc=&output=embed"
    class="w-full h-96 rounded-2xl shadow-md"
    allowfullscreen=""
    loading="lazy">
  </iframe>
</section>


{% endblock %}
