{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex justify-center items-center h-screen bg-gradient-to-br from-orange-100 to-yellow-50">
  <div class="bg-white shadow-2xl rounded-2xl p-10 max-w-md text-center animate-fade-in">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">Logout</h2>
    <p class="text-gray-600 mb-6">Are you sure you want to log out?</p>

    <form method="POST" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit"
        class="px-6 py-2 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg transition duration-300">
        Yes, Logout
      </button>
    </form>

    <a href="/" class="mt-4 inline-block text-sm text-blue-600 hover:underline transition">Cancel</a>
  </div>
</div>

<style>
  .animate-fade-in {
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
{% endblock %}
