{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="py-16 px-4 md:px-32 bg-gray-100 min-h-screen">
  <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-xl animate-fade-in-up">
    
    <!-- Heading -->
    <h2 class="text-3xl font-bold text-[#FF6B00] mb-6 text-center">Submit Your Review</h2>

    <!-- Flash Messages -->
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="p-3 rounded text-white {% if message.tags == 'success' %}bg-green-500{% else %}bg-red-500{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Review Form -->
    <form method="post" novalidate class="space-y-6">
      {% csrf_token %}

      <!-- Rating Field -->
      <div>
        <label for="id_rating" class="block text-gray-700 font-medium mb-1">Rating</label>
        <select name="rating" id="id_rating" class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF6B00]">
          <option value="">Select rating</option>
          <option value="1">⭐ 1 - Poor</option>
          <option value="2">⭐ 2 - Fair</option>
          <option value="3">⭐ 3 - Good</option>
          <option value="4">⭐ 4 - Very Good</option>
          <option value="5">⭐ 5 - Excellent</option>
        </select>
      </div>

      <!-- Comment Field -->
      <div>
        <label for="id_comment" class="block text-gray-700 font-medium mb-1">Your Comment</label>
        <textarea name="comment" id="id_comment" rows="4"
                  class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF6B00] resize-none"
                  placeholder="Share your experience..."></textarea>
      </div>

      <!-- Submit Button -->
      <div class="text-center">
        <button type="submit"
                class="bg-[#FF6B00] text-white px-6 py-3 rounded-lg hover:bg-[#e55a00] transition-all duration-300 shadow-lg hover:scale-105">
          Submit Review
        </button>
      </div>
    </form>
  </div>
</section>

<!-- ✅ Optional Fade In Animation -->
<style>
  @keyframes fade-in-up {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-up {
    animation: fade-in-up 0.6s ease-out;
  }
</style>
{% endblock %}
