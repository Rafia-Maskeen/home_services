{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#FFEFBA] to-[#FFFFFF] py-20 px-4">
  <div class="bg-white rounded-3xl shadow-2xl p-10 w-full max-w-lg" data-aos="zoom-in">

    <!-- Display messages from the backend -->
    {% if messages %}
      {% for message in messages %}
        <div class="mb-4 p-4 {% if message.tags == 'error' %}bg-red-500{% else %}bg-green-500{% endif %} text-white rounded-xl font-semibold text-center">
          {% if message.tags == 'error' %}❌{% else %}✅{% endif %} {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <h2 class="text-3xl font-extrabold text-center text-[#FF6B00] mb-8">Login to Your Account</h2>
    
    <form method="post" class="space-y-6">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" value="{{ form.username.value|default_if_none:'' }}" required
          class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-[#FF6B00] focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-[#FF6B00] focus:outline-none">
      </div>

      <button type="submit"
        class="w-full py-3 bg-[#FF6B00] text-white font-semibold rounded-xl hover:bg-[#e85d00] transition duration-300">
        Login
      </button>
    </form>

    <p class="mt-6 text-sm text-center text-gray-600">
      Don’t have an account?
      <a href="{% url 'register' %}" class="text-[#FF6B00] font-semibold hover:underline">Register</a>
    </p>
  </div>
</section>
{% endblock %}
